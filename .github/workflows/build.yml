name: Patch and Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build and Create Paperclip Jar
        run: ./gradlew build :folia-server:createPaperclipJar --stacktrace

      - name: Prepare Runnable Server Jar
        run: |
          mkdir -p build/artifacts
          cp folia-server/build/libs/folia-paperclip-*.jar build/artifacts/folia.jar

      - name: Verify Runnable Paperclip Jar
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          with ZipFile("build/artifacts/folia.jar") as jar:
              corrupt_entry = jar.testzip()
              if corrupt_entry is not None:
                  raise SystemExit(f"Corrupt JAR entry: {corrupt_entry}")
              manifest = jar.read("META-INF/MANIFEST.MF").decode().splitlines()
              if "Main-Class: io.papermc.paperclip.Main" not in manifest:
                  raise SystemExit("Expected a runnable Paperclip JAR")
              jar.getinfo("io/papermc/paperclip/Main.class")
          print("Verified runnable Paperclip JAR")
          PY

      - name: Upload Runnable Server Jar
        id: server
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/folia.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Link Server Jar Download
        env:
          ARTIFACT_URL: ${{ steps.server.outputs.artifact-url }}
        run: |
          echo "### Runnable Folia server" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Folia server jar]($ARTIFACT_URL) (retained for 30 days)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Download `folia.jar` directly and run with Java 25: `java -jar folia.jar --nogui`.' >> "$GITHUB_STEP_SUMMARY"
